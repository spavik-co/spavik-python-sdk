[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spavik"
version = "0.1.0"
description = "Python client for the Spavik API: training, prediction, forecasting, feedback loop."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Spavik", email = "admin@spavik.co" }]
keywords = ["spavik", "prediction", "forecasting", "sdk"]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://spavik.co"
Documentation = "https://test-docs.spavik.co/libraries/python"
Repository = "https://github.com/spavik-co/spavik-python-sdk"
Issues = "https://github.com/spavik-co/spavik-python-sdk/issues"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/contract", "/examples", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/RELEASING.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/spavik"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pip-audit==2.10.1", "hatchling==1.32.4"]

[tool.uv]
required-version = "==0.13.6"
# Isolated PEP 517 builds use the same reviewed backend and transitives.
build-constraint-dependencies = [
  "hatchling==1.32.4", "packaging==26.3", "pathspec==1.1.1",
  "pluggy==1.7.0", "tomlkit==0.15.2", "trove-classifiers==2026.9.21.13",
]
