[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spavik"
version = "0.1.1"
description = "Prediction API for Python apps: create a model from your data in one call, then predict churn, conversions, prices, delivery times or demand. No ML stack to build."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Spavik", email = "admin@spavik.co" }]
keywords = [
  "spavik", "prediction", "prediction-api", "predictive-analytics", "machine-learning",
  "automl", "forecasting", "time-series", "churn-prediction", "lead-scoring",
  "classification", "regression", "tabular-data", "ai-agents", "mcp", "api-client", "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://spavik.co"
Documentation = "https://docs.spavik.co/libraries/python"
Repository = "https://github.com/spavik-co/spavik-python-sdk"
Issues = "https://github.com/spavik-co/spavik-python-sdk/issues"
Changelog = "https://github.com/spavik-co/spavik-python-sdk/blob/main/CHANGELOG.md"
"Use cases" = "https://spavik.co/use-cases"
Pricing = "https://spavik.co/pricing"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/contract", "/examples", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/RELEASING.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/spavik"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pip-audit==2.10.1", "hatchling==1.32.4"]

[tool.uv]
required-version = "==0.13.6"
# Isolated PEP 517 builds use the same reviewed backend and transitives.
build-constraint-dependencies = [
  "hatchling==1.32.4", "packaging==26.3", "pathspec==1.1.1",
  "pluggy==1.7.0", "tomlkit==0.15.2", "trove-classifiers==2026.9.21.13",
]
