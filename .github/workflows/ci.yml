name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras python scripts/generate_contract.py --check
      - run: uv pip check
      - run: uv run --locked --all-extras pip-audit --skip-editable
      - run: uv run --locked --all-extras python -m pytest -q
      - run: uv run --locked --all-extras python examples/evaluate.py --help
      - run: uv run --locked --all-extras python examples/backtest.py --help

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-extras
      # build creates the wheel from the sdist, not directly from the checkout.
      - run: uv run --locked --all-extras python -m build --no-isolation
      - run: uv run --locked --all-extras python -m twine check dist/*
      - run: uv run --locked --all-extras python scripts/check_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
